html,body{height:100%;margin:0;background:#05020c}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:max(100vw,calc(100vh * 1672 / 941));aspect-ratio:1672/941;overflow:hidden}
.im{position:absolute;inset:0;background:var(--img) center/100% 100%;transform-origin:49.9% 57.4%}
.z{animation:zoom 5s cubic-bezier(.5,0,.95,.55) infinite;opacity:0}
.z.b{animation-delay:-2.5s}
@keyframes zoom{0%{transform:scale(1);opacity:0}25%{opacity:.85}65%{opacity:.6}100%{transform:scale(2.6);opacity:0}}
.base{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:brightness(1) saturate(1)}50%{filter:brightness(1.12) saturate(1.15)}}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;mix-blend-mode:screen;pointer-events:none}
.g{position:absolute;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);mix-blend-mode:screen;pointer-events:none;
 background:radial-gradient(circle,var(--c) 0,transparent 66%);animation:fl var(--d) ease-in-out var(--dl) infinite}
@keyframes fl{0%,100%{opacity:var(--a)}40%{opacity:calc(var(--a)*.35)}60%{opacity:var(--a)}85%{opacity:calc(var(--a)*.6)}}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 57%,transparent 40%,rgba(5,2,12,.55) 100%)}
@media (prefers-reduced-motion:reduce){.z{animation:none;opacity:0}.base,.g{animation:none}}
</style></head><body>
<div class="stage" id="st">
<div class="im base"></div>
<div class="im z"></div>
<div class="im z b"></div>
<canvas id="cv" width="836" height="470"></canvas>
<div class="vig"></div>
</div>
<script>
const W=1672,H=941,st=document.getElementById('st'),cv=document.getElementById('cv');
// [x,y,size,color,period,delay,alpha]
const L=[[835,548,300,'#ff4aa0',1.8,0,.8],[835,548,120,'#ffffff',1.2,.3,.6],[260,583,260,'#ff2a3a',2.6,0,.6],[440,617,200,'#ff2a3a',3.1,.7,.5],
[1380,645,260,'#ff2a3a',2.8,.4,.6],[1590,40,220,'#ff3a4a',3.3,.2,.5],[1570,150,100,'#ff4a5a',2.2,.9,.5],[1730,110,10,'#000',1,0,0]];
L.forEach(([x,y,s,c,d,dl,a])=>{if(!a)return;const e=document.createElement('div');e.className='g';
 e.style.cssText=`left:${x/W*100}%;top:${y/H*100}%;width:${s/W*100}%;--c:${c};--d:${d}s;--dl:${dl}s;--a:${a}`;
 st.insertBefore(e,document.querySelector('.vig'))});
const x=cv.getContext('2d'),cx=418,cy=270,vy=290,CH=470,CW=836;
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cols=['#ff4a6a','#ff2a3a','#c04aff','#ffffff','#6a4aff'];
const mk=()=>({a:Math.random()*Math.PI*2,r:6+Math.random()*30,v:.8+Math.random()*1.6,c:cols[Math.random()*cols.length|0],w:Math.random()<.2?2:1});
const S=Array.from({length:110},()=>{const s=mk();s.r+=Math.random()*300;return s});
const N=14;
function f(t){x.clearRect(0,0,CW,CH);
 // moving floor lines
 for(let i=0;i<N;i++){const u=((t/2600)+i/N)%1,d=1-u*.96,y=vy+(CH-vy)*(.04/d);if(y>CH)continue;
  const hw=(y-vy)*3.2,al=Math.min(1,(y-vy)/120)*.85;
  x.globalAlpha=al;x.fillStyle='#ff3a6a';x.fillRect(Math.max(0,cx-hw),y|0,Math.min(CW,cx+hw)-Math.max(0,cx-hw),y>380?2:1)}
 // speed streaks from the vanishing point
 S.forEach(s=>{const pr=s.r;s.r+=s.v*(1+s.r/60);
  const l=Math.min(s.r-pr+s.r*.08,60),x1=cx+Math.cos(s.a)*s.r,y1=cy+Math.sin(s.a)*s.r*.62+14,x0=cx+Math.cos(s.a)*(s.r-l),y0=cy+Math.sin(s.a)*(s.r-l)*.62+14;
  x.globalAlpha=Math.min(1,s.r/80)*.8;x.strokeStyle=s.c;x.lineWidth=s.w;x.beginPath();x.moveTo(x0|0,y0|0);x.lineTo(x1|0,y1|0);x.stroke();
  if(x1<-20||x1>CW+20||y1<-20||y1>CH+20)Object.assign(s,mk())});
 x.globalAlpha=1;if(!still)requestAnimationFrame(f)}
requestAnimationFrame(f);
</script></body></html>
