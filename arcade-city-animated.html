<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Нічне місто — анімація</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#04050c}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:max(100vw,calc(100vh * 1672 / 941));aspect-ratio:1672/941;overflow:hidden}
.stage>img,.stage>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas{image-rendering:pixelated;pointer-events:none}
.g{position:absolute;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);mix-blend-mode:screen;pointer-events:none;
 background:radial-gradient(circle,var(--c) 0,transparent 66%);animation:fl var(--d) ease-in-out var(--dl) infinite}
@keyframes fl{0%,100%{opacity:var(--a)}30%{opacity:calc(var(--a)*.45)}45%{opacity:calc(var(--a)*.95)}70%{opacity:calc(var(--a)*.6)}}
.fall{position:absolute;transform:translateX(-50%);mix-blend-mode:screen;pointer-events:none;opacity:.55;
 background:repeating-linear-gradient(180deg,rgba(90,220,255,.0) 0 6px,rgba(120,240,255,.9) 6px 9px,rgba(90,220,255,0) 9px 16px);
 background-size:100% 32px;animation:fall 1.1s linear infinite;-webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}
@keyframes fall{to{background-position:0 32px}}
.screen{position:absolute;left:15.9%;top:46%;width:8.6%;height:14%;mix-blend-mode:screen;pointer-events:none;
 background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 2px,transparent 2px 4px),linear-gradient(115deg,#18f0ff 0,#2b5bff 40%,#ff3cd0 70%,#18f0ff 100%);
 background-size:100% 100%,300% 100%;animation:scr 2.4s steps(24) infinite;opacity:.4}
@keyframes scr{0%{background-position:0 0,0 0;opacity:.35}25%{opacity:.6}50%{background-position:0 4px,100% 0;opacity:.3}75%{opacity:.55}100%{background-position:0 0,200% 0;opacity:.35}}
.mq{position:absolute;left:17.4%;top:32.5%;width:9%;height:9%;mix-blend-mode:screen;pointer-events:none;
 background:linear-gradient(90deg,#ff3cd0,#4af0ff,#ff3cd0,#4af0ff);background-size:200% 100%;animation:mq 1.2s steps(6) infinite;opacity:.45}
@keyframes mq{to{background-position:200% 0}}
.fog{position:absolute;left:-30%;width:160%;height:16%;mix-blend-mode:screen;pointer-events:none;
 background:radial-gradient(ellipse at 50% 50%,rgba(70,110,255,.30),transparent 70%);animation:dr 40s linear infinite alternate}
@keyframes dr{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
@media (prefers-reduced-motion:reduce){.g,.fall,.screen,.mq,.fog{animation:none}}
</style></head><body>
