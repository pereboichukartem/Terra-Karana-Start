<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Світ-джунглі — анімація</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#04050c}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:max(100vw,calc(100vh * 1672 / 941));aspect-ratio:1672/941;overflow:hidden}
.stage>img,.stage>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas{image-rendering:pixelated;pointer-events:none}
.g{position:absolute;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);mix-blend-mode:screen;pointer-events:none;
 background:radial-gradient(circle,var(--c) 0,transparent 66%);animation:fl var(--d) ease-in-out var(--dl) infinite}
@keyframes fl{0%,100%{opacity:var(--a)}35%{opacity:calc(var(--a)*.4)}60%{opacity:var(--a)}80%{opacity:calc(var(--a)*.65)}}
.fall{position:absolute;transform:translateX(-50%);mix-blend-mode:screen;pointer-events:none;opacity:.6;
 background:repeating-linear-gradient(180deg,rgba(90,220,255,0) 0 6px,rgba(150,245,255,.9) 6px 9px,rgba(90,220,255,0) 9px 16px);
 background-size:100% 32px;animation:fall 1.2s linear infinite;-webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}
@keyframes fall{to{background-position:0 32px}}
.river{position:absolute;left:57%;top:67%;width:8%;height:8%;mix-blend-mode:screen;pointer-events:none;opacity:.35;
 background:repeating-linear-gradient(100deg,transparent 0 10px,rgba(160,240,255,.8) 10px 13px,transparent 13px 26px);background-size:52px 100%;animation:rv 2.4s linear infinite}
@keyframes rv{to{background-position:52px 0}}
.rays{position:absolute;left:25.7%;top:33%;width:140%;aspect-ratio:1;transform:translate(-50%,-50%);mix-blend-mode:screen;pointer-events:none;opacity:.2;
 background:repeating-conic-gradient(from 0deg,rgba(255,190,90,.9) 0 4deg,transparent 4deg 14deg);
 -webkit-mask-image:radial-gradient(circle,#000 0,transparent 36%);mask-image:radial-gradient(circle,#000 0,transparent 36%);animation:ry 90s linear infinite}
@keyframes ry{to{transform:translate(-50%,-50%) rotate(360deg)}}
.fog{position:absolute;left:-30%;width:160%;height:15%;mix-blend-mode:screen;pointer-events:none;
 background:radial-gradient(ellipse at 50% 50%,rgba(150,160,255,.32),transparent 70%);animation:dr 50s linear infinite alternate}
@keyframes dr{from{transform:translateX(-9%)}to{transform:translateX(9%)}}
@media (prefers-reduced-motion:reduce){.g,.fall,.river,.rays,.fog{animation:none}}
</style></head><body>
